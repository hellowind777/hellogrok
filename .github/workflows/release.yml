name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
          - runner: windows-latest
            goos: windows
            goarch: arm64
            ext: .exe
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ""
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            ext: ""
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test on build host
        run: CGO_ENABLED=0 go test ./... -count=1

      - name: Verify tag matches appinfo.Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' internal/appinfo/appinfo.go | head -1)
          echo "tag=$tag appinfo.Version=$version"
          if [ "$tag" != "$version" ]; then
            echo "tag '$GITHUB_REF_NAME' does not match appinfo.Version '$version'" >&2
            exit 1
          fi

      - name: Build release binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          base="dist/hellogrok-${GOOS}-${GOARCH}${{ matrix.ext }}"
          if [ "$GOOS" = "windows" ]; then
            go build -trimpath -ldflags="-s -w -H windowsgui" -o "$base" ./cmd/hellogrok
            go build -trimpath -ldflags="-s -w" -o "dist/hellogrok-cli-${GOOS}-${GOARCH}${{ matrix.ext }}" ./cmd/hellogrok
          else
            go build -trimpath -ldflags="-s -w" -o "$base" ./cmd/hellogrok
          fi
          (
            cd dist
            for file in *; do
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$file" > "$file.sha256"
              else
                shasum -a 256 "$file" > "$file.sha256"
              fi
            done
          )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hellogrok-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Prepare bilingual release notes
        run: |
          {
            cat RELEASE_NOTES.md
            printf '\n\n---\n\n'
            cat RELEASE_NOTES_CN.md
          } > "$RUNNER_TEMP/release-notes.md"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
          fi
